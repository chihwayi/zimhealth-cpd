name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://zimhealth:zimhealth_dev@localhost:5432/zimhealth
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_EXPIRES_IN: 7d
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zimhealth
          POSTGRES_PASSWORD: zimhealth_dev
          POSTGRES_DB: zimhealth
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # Avoid `pnpm -C` portability issues in CI runners; use workspace filter instead.
      - run: pnpm --filter @zimhealth/backend exec prisma generate
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
